<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":["Organization","ProfessionalService"],"@id":"https://ascentforsponsors.com/#organization","name":"Ascent","legalName":"Ascent Client Acquisition Systems LLC","alternateName":"Ascent Client Acquisition Systems","url":"https://ascentforsponsors.com","logo":{"@type":"ImageObject","url":"https://ascentforsponsors.com/icon-512.png","width":512,"height":512},"image":"https://ascentforsponsors.com/og-sponsors.png","description":"Ascent is a flat-fee investor acquisition firm for U.S. real estate syndicators and private real estate fund sponsors raising under Rule 506(c). It runs counsel-approved paid media on Meta, Google and X, instrumented lead response, and a live, scripted appointment setter who calls every inbound investor lead as the sponsor — and reports one primary number, cost per appointment held. Ascent is not a broker-dealer, finder or placement agent, never verifies accredited status, and takes nothing tied to capital raised.","slogan":"We find investors for 506(c) real estate sponsors","areaServed":{"@type":"Country","name":"United States"},"address":{"@type":"PostalAddress","streetAddress":"204 N Robinson Ave","addressLocality":"Oklahoma City","addressRegion":"OK","postalCode":"73102","addressCountry":"US"},"knowsAbout":["Investor acquisition for real estate syndications and private real estate funds","Regulation D Rule 506(c) general solicitation","Accredited investor lead generation on Meta, Google and X","Investor lead response and appointment setting","Cost per appointment held"],"founder":{"@id":"https://ascentcas.com/#caleb-free"},"contactPoint":{"@type":"ContactPoint","contactType":"sales","telephone":"+14055637863","email":"info@ascentforsponsors.com","areaServed":"US","availableLanguage":"en"}},{"@type":"Person","@id":"https://ascentcas.com/#caleb-free","name":"Caleb Free","jobTitle":"Founder","worksFor":{"@id":"https://ascentforsponsors.com/#organization"}},{"@type":"WebSite","@id":"https://ascentforsponsors.com/#website","url":"https://ascentforsponsors.com","name":"Ascent","publisher":{"@id":"https://ascentforsponsors.com/#organization"},"inLanguage":"en-US"},{"@type":"Article","@id":"https://ascentforsponsors.com/guide-placement-agent-vs-flat-fee-investor-acquisition/#article","headline":"Placement agent, finder, in-house IR or flat-fee investor acquisition: how sponsors pay to fill a raise","alternativeHeadline":"Placement Agent vs. Flat Fee: How Sponsors Pay for Investors","description":"A real estate sponsor has four ways to pay to find investors. They are a placement agent, a finder, an in-house hire and a flat-fee firm. Here is how they compare. We look at cost. We look at who owns the investor. We also look at the broker-dealer line.","abstract":"A real estate sponsor can pay for investors in four ways. First is a registered placement agent or broker-dealer. That is a firm registered to sell securities. It takes a share of the money raised. People often quote several percent. In private real estate it is often 6 to 8 percent. And the agent often keeps the tie to the investor. Second is an unregistered finder paid the same way. The SEC most often sees that finder as an unregistered broker. That puts you at risk, not just the finder. Third is your own investor relations hire. That is a fixed salary. It often runs $90,000 to $140,000 a year fully loaded. That counts benefits and overhead. You pay it whether or not a raise is open. Fourth is a flat-fee investor acquisition firm. It charges a monthly fee. The fee pays for ads, lead response and appointment setting. None of it is tied to the money raised. So you keep the equity. You own the investor list, too. Price is only part of the gap. The rest is who owns the investor. And it is which side of the broker-dealer line the vendor is on.","articleSection":"Fee models · Compliance","url":"https://ascentforsponsors.com/guide-placement-agent-vs-flat-fee-investor-acquisition","mainEntityOfPage":"https://ascentforsponsors.com/guide-placement-agent-vs-flat-fee-investor-acquisition","isPartOf":{"@id":"https://ascentforsponsors.com/#website"},"datePublished":"2026-09-09","dateModified":"2026-10-09","author":{"@id":"https://ascentcas.com/#caleb-free"},"publisher":{"@id":"https://ascentforsponsors.com/#organization"},"image":{"@type":"ImageObject","url":"https://ascentforsponsors.com/guide-images/placement-agent-vs-flat-fee-investor-acquisition.jpg","width":960,"height":540,"caption":"Two people shake hands across a desk. A notebook and a cup of coffee sit between them."},"inLanguage":"en-US","isAccessibleForFree":true,"wordCount":2317,"citation":["https://www.law.cornell.edu/uscode/text/15/78o","https://www.sec.gov/about/reports-publications/investor-publications/guide-broker-dealer-registration","https://www.sec.gov/newsroom/press-releases/2020-248","https://www.ecfr.gov/current/title-17/chapter-II/part-240/section-240.3a4-1","https://www.ecfr.gov/current/title-17/chapter-II/part-230/subject-group-ECFR6e651a4c86c0174/section-230.506"]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://ascentforsponsors.com/"},{"@type":"ListItem","position":2,"name":"Guides","item":"https://ascentforsponsors.com/guides"},{"@type":"ListItem","position":3,"name":"Placement agent, finder, in-house IR or flat-fee investor acquisition: how sponsors pay to fill a raise","item":"https://ascentforsponsors.com/guide-placement-agent-vs-flat-fee-investor-acquisition"}]},{"@type":"FAQPage","@id":"https://ascentforsponsors.com/guide-placement-agent-vs-flat-fee-investor-acquisition/#faq","mainEntity":[{"@type":"Question","name":"Can a marketing agency take a cut of the money raised?","acceptedAnswer":{"@type":"Answer","text":"Not under the law, unless it is a registered broker-dealer. Transaction-based compensation is pay tied to the money raised. Say it is paid for soliciting investors. Then it is the clearest sign of a broker. That comes from Section 15(a) of the Exchange Act. Say an unregistered vendor takes it. That is a risk for the sponsor. It is a risk for the vendor, too."}},{"@type":"Question","name":"What does a placement agent charge for a real estate raise?","acceptedAnswer":{"@type":"Answer","text":"For private real estate, published ranges run to several percent of what is raised. A common figure is 6 to 8%. On a $10 million raise, that is $600,000 to $800,000. It is most often treated as an offering cost. That means the equity pays it."}},{"@type":"Question","name":"Is a finder's fee legal for bringing in investors?","acceptedAnswer":{"@type":"Answer","text":"Most of the time, no. Not for an unregistered person paid on money raised. The SEC put forward a limited finder exemption in 2020. It never adopted it. SEC staff no-action letters have let some very narrow setups go ahead. Most setups are not allowed. Counsel should look at any finder offer before it is signed."}},{"@type":"Question","name":"Is Ascent a broker-dealer, finder or placement agent?","acceptedAnswer":{"@type":"Answer","text":"No. Ascent is a vendor paid a flat monthly fee. It does marketing and lead response. It also sets appointments and reports. Its contract has an express clause: no transaction-based compensation. Ascent never talks about the offering. It never handles funds. It never checks accredited status. It never gives advice on what to invest in."}},{"@type":"Question","name":"A flat-fee firm can't guarantee capital. So what can it guarantee?","acceptedAnswer":{"@type":"Answer","text":"It can guarantee a minimum number of investor appointments held. That is for a set span of time. The number is put in writing. It is based on your ad budget and past results. If the firm misses it, there is a remedy. Ascent's is to keep working at no fee until it hits the minimum. No result about money raised is promised anywhere."}}]}]}</script>
