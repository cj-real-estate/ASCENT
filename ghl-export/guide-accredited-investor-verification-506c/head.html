<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":["Organization","ProfessionalService"],"@id":"https://ascentforsponsors.com/#organization","name":"Ascent","legalName":"Ascent Client Acquisition Systems LLC","alternateName":"Ascent Client Acquisition Systems","url":"https://ascentforsponsors.com","logo":{"@type":"ImageObject","url":"https://ascentforsponsors.com/icon-512.png","width":512,"height":512},"image":"https://ascentforsponsors.com/og-sponsors.png","description":"Ascent is a flat-fee investor acquisition firm for U.S. real estate syndicators and private real estate fund sponsors raising under Rule 506(c). It runs counsel-approved paid media on Meta, Google and X, instrumented lead response, and a live, scripted appointment setter who calls every inbound investor lead as the sponsor — and reports one primary number, cost per appointment held. Ascent is not a broker-dealer, finder or placement agent, never verifies accredited status, and takes nothing tied to capital raised.","slogan":"We find investors for 506(c) real estate sponsors","areaServed":{"@type":"Country","name":"United States"},"address":{"@type":"PostalAddress","streetAddress":"204 N Robinson Ave","addressLocality":"Oklahoma City","addressRegion":"OK","postalCode":"73102","addressCountry":"US"},"knowsAbout":["Investor acquisition for real estate syndications and private real estate funds","Regulation D Rule 506(c) general solicitation","Accredited investor lead generation on Meta, Google and X","Investor lead response and appointment setting","Cost per appointment held"],"founder":{"@id":"https://ascentcas.com/#caleb-free"},"contactPoint":{"@type":"ContactPoint","contactType":"sales","telephone":"+14055637863","email":"info@ascentforsponsors.com","areaServed":"US","availableLanguage":"en"}},{"@type":"Person","@id":"https://ascentcas.com/#caleb-free","name":"Caleb Free","jobTitle":"Founder","worksFor":{"@id":"https://ascentforsponsors.com/#organization"}},{"@type":"WebSite","@id":"https://ascentforsponsors.com/#website","url":"https://ascentforsponsors.com","name":"Ascent","publisher":{"@id":"https://ascentforsponsors.com/#organization"},"inLanguage":"en-US"},{"@type":"Article","@id":"https://ascentforsponsors.com/guide-accredited-investor-verification-506c/#article","headline":"How to verify accredited investors under Rule 506(c) after the SEC's March 2025 guidance","alternativeHeadline":"Verify Accredited Investors Under 506(c): 2025 SEC Guidance","description":"What \"reasonable steps to verify\" means under Rule 506(c). See the safe harbor methods and third-party checks. Learn what the SEC staff's March 2025 no-action letter says about a high minimum.","abstract":"Under Rule 506(c), each buyer must be an accredited investor. That is a buyer who meets the SEC's tests, such as for income or wealth. The issuer must take reasonable steps to verify this. The issuer is the company that sells the deal. Verify means check. The buyer's own word alone is not enough. The rule gives four safe harbors. These are ways the rule says will count. You may use other ways too. One: look at two years of tax forms for income. Two: look at recent account statements and a credit report for net worth. Three: get it confirmed in writing by a registered broker-dealer, an SEC-registered investment adviser, a licensed attorney or a CPA. Four: get a certification from an existing investor who bought before September 2013. On March 12, 2025, SEC staff issued a no-action letter. In it, staff said one way can be reasonable steps by itself. The minimum investment is $200,000 for a natural person, meaning one human. For an entity, it is $1,000,000. The buyer states in writing that they are accredited. The buyer also states that no third party is financing the investment for that purpose. This works only if the issuer knows no facts that say otherwise. The issuer's securities counsel picks the method. That is its lawyer for securities law. Verification always happens at subscription, when the buyer signs up. It never happens on the ad or the first call.","articleSection":"Regulation D · Verification","url":"https://ascentforsponsors.com/guide-accredited-investor-verification-506c","mainEntityOfPage":"https://ascentforsponsors.com/guide-accredited-investor-verification-506c","isPartOf":{"@id":"https://ascentforsponsors.com/#website"},"datePublished":"2026-09-09","dateModified":"2026-10-09","author":{"@id":"https://ascentcas.com/#caleb-free"},"publisher":{"@id":"https://ascentforsponsors.com/#organization"},"image":{"@type":"ImageObject","url":"https://ascentforsponsors.com/guide-images/accredited-investor-verification-506c.jpg","width":960,"height":540,"caption":"A pen rests on the signature line of a printed contract."},"inLanguage":"en-US","isAccessibleForFree":true,"wordCount":2020,"citation":["https://www.ecfr.gov/current/title-17/chapter-II/part-230/subject-group-ECFR6e651a4c86c0174/section-230.506","https://www.sec.gov/rules-regulations/2013/07/eliminating-prohibition-against-general-solicitation-general-advertising-rule-506-rule-144a-offerings","https://www.sec.gov/rules-regulations/staff-guidance/corporation-finance-no-action-letters","https://www.ecfr.gov/current/title-17/chapter-II/part-230/subject-group-ECFR6e651a4c86c0174/section-230.501"]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://ascentforsponsors.com/"},{"@type":"ListItem","position":2,"name":"Guides","item":"https://ascentforsponsors.com/guides"},{"@type":"ListItem","position":3,"name":"How to verify accredited investors under Rule 506(c) after the SEC's March 2025 guidance","item":"https://ascentforsponsors.com/guide-accredited-investor-verification-506c"}]},{"@type":"FAQPage","@id":"https://ascentforsponsors.com/guide-accredited-investor-verification-506c/#faq","mainEntity":[{"@type":"Question","name":"Is a signed form enough to verify accredited status under 506(c)?","acceptedAnswer":{"@type":"Answer","text":"On its own, no. The SEC has said a check-the-box statement with nothing more is not reasonable steps. But it can be part of a method. For example, the March 2025 no-action letter relies on written statements plus a high minimum investment."}},{"@type":"Question","name":"What minimum lets a sponsor rely on the March 2025 letter?","acceptedAnswer":{"@type":"Answer","text":"At least $200,000 for a natural person. At least $1,000,000 for an entity. It must come with the written statements the letter calls for. And the issuer must not know facts that say otherwise. Counsel decides whether and how to rely on it."}},{"@type":"Question","name":"How recent do the papers have to be?","acceptedAnswer":{"@type":"Answer","text":"Under the net worth safe harbor, the statements and credit report must be dated in the past three months. Under the third-party method, the confirmation must be from the past three months. Income checks use IRS forms from the two most recent years."}},{"@type":"Question","name":"Does the sponsor have to see an investor's tax returns?","acceptedAnswer":{"@type":"Answer","text":"Not always. A third-party verification service can look at the papers. So can a pro the rule lists, such as a CPA. Then they confirm it in writing. So the sponsor's files hold the letter, not the returns."}},{"@type":"Question","name":"Does Ascent verify accredited investors?","acceptedAnswer":{"@type":"Answer","text":"No. Ascent never asks about, judges or verifies accredited investor status. The CRM it runs for a sponsor has no field for it. Verification stays with the issuer, under counsel's process."}}]}]}</script>
