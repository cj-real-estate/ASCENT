<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":["Organization","ProfessionalService"],"@id":"https://ascentforsponsors.com/#organization","name":"Ascent","legalName":"Ascent Client Acquisition Systems LLC","alternateName":"Ascent Client Acquisition Systems","url":"https://ascentforsponsors.com","logo":{"@type":"ImageObject","url":"https://ascentforsponsors.com/icon-512.png","width":512,"height":512},"image":"https://ascentforsponsors.com/og-sponsors.png","description":"Ascent is a flat-fee investor acquisition firm for U.S. real estate syndicators and private real estate fund sponsors raising under Rule 506(c). It runs counsel-approved paid media on Meta, Google and X, instrumented lead response, and a live, scripted appointment setter who calls every inbound investor lead as the sponsor — and reports one primary number, cost per appointment held. Ascent is not a broker-dealer, finder or placement agent, never verifies accredited status, and takes nothing tied to capital raised.","slogan":"We find investors for 506(c) real estate sponsors","areaServed":{"@type":"Country","name":"United States"},"address":{"@type":"PostalAddress","streetAddress":"204 N Robinson Ave","addressLocality":"Oklahoma City","addressRegion":"OK","postalCode":"73102","addressCountry":"US"},"knowsAbout":["Investor acquisition for real estate syndications and private real estate funds","Regulation D Rule 506(c) general solicitation","Accredited investor lead generation on Meta, Google and X","Investor lead response and appointment setting","Cost per appointment held"],"founder":{"@id":"https://ascentcas.com/#caleb-free"},"contactPoint":{"@type":"ContactPoint","contactType":"sales","telephone":"+14055637863","email":"info@ascentforsponsors.com","areaServed":"US","availableLanguage":"en"}},{"@type":"Person","@id":"https://ascentcas.com/#caleb-free","name":"Caleb Free","jobTitle":"Founder","worksFor":{"@id":"https://ascentforsponsors.com/#organization"}},{"@type":"WebSite","@id":"https://ascentforsponsors.com/#website","url":"https://ascentforsponsors.com","name":"Ascent","publisher":{"@id":"https://ascentforsponsors.com/#organization"},"inLanguage":"en-US"},{"@type":"Article","@id":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#article","headline":"Investor acquisition glossary for real estate sponsors","alternativeHeadline":"Investor Acquisition Glossary for Real Estate Sponsors","description":"Plain meanings of the words in 506(c) investor acquisition. It covers accredited investor and general solicitation. It also covers speed to lead, set-to-held rate and cost per appointment held.","abstract":"Investor acquisition means finding accredited investors for a private real estate offering. Then you get each one into a meeting with the sponsor. The work ends when that meeting is held. Under Regulation D, ads for this are lawful only in Rule 506(c) and Regulation A+ offerings. The terms below come in three kinds. Some are legal words a sponsor's counsel uses. Some are marketing words a media vendor uses. The rest are response numbers. Ascent reports them to each sponsor each week. They are speed to first human touch, contact rate, set-to-held rate and cost per appointment held.","articleSection":"Reference · Glossary","url":"https://ascentforsponsors.com/guide-investor-acquisition-glossary","mainEntityOfPage":"https://ascentforsponsors.com/guide-investor-acquisition-glossary","isPartOf":{"@id":"https://ascentforsponsors.com/#website"},"datePublished":"2026-09-09","dateModified":"2026-10-09","author":{"@id":"https://ascentcas.com/#caleb-free"},"publisher":{"@id":"https://ascentforsponsors.com/#organization"},"image":{"@type":"ImageObject","url":"https://ascentforsponsors.com/guide-images/investor-acquisition-glossary.jpg","width":960,"height":540,"caption":"A hand writes notes with a pen on printed pages. A laptop and a coffee cup sit nearby."},"inLanguage":"en-US","isAccessibleForFree":true,"wordCount":1795,"citation":["https://www.ecfr.gov/current/title-17/chapter-II/part-230/subject-group-ECFR6e651a4c86c0174","https://www.sec.gov/about/reports-publications/investor-publications/guide-broker-dealer-registration","https://gowercrowd.com"]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://ascentforsponsors.com/"},{"@type":"ListItem","position":2,"name":"Guides","item":"https://ascentforsponsors.com/guides"},{"@type":"ListItem","position":3,"name":"Investor acquisition glossary for real estate sponsors","item":"https://ascentforsponsors.com/guide-investor-acquisition-glossary"}]},{"@type":"FAQPage","@id":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#faq","mainEntity":[{"@type":"Question","name":"How is a set appointment different from a held one?","acceptedAnswer":{"@type":"Answer","text":"A set (or booked) appointment is a calendar entry. A held appointment is one that took place. Ascent reports and guarantees held appointments. That is because meetings nobody attends can inflate a booked count."}},{"@type":"Question","name":"What is investor acquisition?","acceptedAnswer":{"@type":"Answer","text":"It means getting accredited-investor leads for a 506(c) or Reg A+ offering. Then you work those leads until a meeting with the sponsor is actually held. The work is response, nurture, setting and confirmation. It is reported as cost per appointment held."}},{"@type":"Question","name":"Why does Ascent say investor lead and not prospect?","acceptedAnswer":{"@type":"Answer","text":"Because the words say what happened. A person answered the sponsor's ads and asked to hear more. Ascent's setters call only those inbound leads. They never call from a list. They never call anyone who did not ask."}}]},{"@type":"DefinedTermSet","@id":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms","name":"Investor acquisition glossary for real estate sponsors","hasDefinedTerm":[{"@type":"DefinedTerm","name":"Accredited investor","description":"A person or entity that meets the tests in Rule 501(a) of Regulation D. For a natural person, the common tests look at income or net worth. Income must be above $200,000 in each of the last two years. Joint income must be above $300,000. Or net worth must be above $1,000,000, not counting the primary residence. Since 2020, holders of the Series 7, 65 or 82 licenses count too. Entities have their own tests. One is more than $5,000,000 in investments.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Regulation D","description":"The SEC's set of rules under the Securities Act. They let some private offerings skip registration. Rule 506 is the exemption used most. It has two paragraphs. Almost every real estate syndication raises money under one of them. So does almost every private real estate fund.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Rule 506(b)","description":"The Regulation D exemption that bans general solicitation. Any number of accredited investors may buy. So may up to 35 others. They are not accredited, but they must be sophisticated. The issuer must reasonably believe each buyer is accredited. That belief is usually based on self-certification. Buyers come from pre-existing relationships.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Rule 506(c)","description":"The Regulation D exemption that allows general solicitation. The JOBS Act made it in 2013. Each buyer must be an accredited investor. The issuer must take reasonable steps to verify that status. It is the only Rule 506 path where paid investor acquisition is lawful.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"General solicitation","description":"Offering or advertising securities to the public. Paid ads count. So do a public offering page, social media, mass email and public events. Rule 506(b) bans it. Rule 506(c) allows it. The way you reach people does not matter. Telling strangers about an open offering is solicitation.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Reasonable steps to verify","description":"The 506(c) standard for checking that a buyer is accredited. It is based on principles. It names four safe harbors. Other ways can work too, since the four are non-exclusive. They are income documents, net-worth documents, third-party confirmation and grandfathered investors. In March 2025, an SEC staff no-action letter added a minimum-investment approach. It is set at $200,000 for natural persons and $1,000,000 for entities.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Form D","description":"The notice an issuer files with the SEC. It is due within 15 days of the first sale in a Regulation D offering. It names the exemption used. It shows the amount offered and sold. It shows the minimum investment. It lists any sales compensation paid. Anyone can see it on EDGAR.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Regulation A+","description":"An exemption for public offerings of up to $75 million (Tier 2). The SEC must qualify the offering statement. People who are not accredited can invest too, within limits. It allows general solicitation. Paid investor acquisition can serve two structures. Rule 506(c) is one. Regulation A+ is the other.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Broker-dealer","description":"A person engaged in the business of effecting transactions in securities for others. This person must register under Section 15(a) of the Exchange Act. The clearest sign of broker work is transaction-based compensation. That means a fee tied to capital raised.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Placement agent","description":"A registered broker-dealer an issuer hires to find and solicit investors. It is paid a share of the capital raised. The share is often quoted at several percent. In private real estate it is 6 to 8%. It is lawful because it is registered. It is priced to match.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Finder","description":"An unregistered person paid to introduce investors. Say the fee depends on the money raised. Then the SEC generally treats the finder as an unregistered broker. A 2020 proposal would have exempted some finders. It was never adopted.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Transaction-based compensation","description":"Any fee that depends on whether capital is raised, or how much. It also covers a fee tied to how many investors are introduced. Or one tied to how many subscriptions close. A flat fee for a defined service has none of this. That keeps a marketing vendor on the vendor side of the broker line.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Rule 3a4-1","description":"An Exchange Act safe harbor. It covers certain associated persons of an issuer. These are employees or officers who are not paid commissions. They must also meet the rule's other conditions. They may take part in selling the issuer's securities. If so, they are deemed not to be brokers.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Bad-actor disqualification","description":"Rule 506(d). A disqualifying event can mean the issuer cannot use Rule 506. Such events include certain convictions, orders or bars. The event must involve the issuer or a covered person. Covered persons include anyone paid to solicit investors.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Sponsor / issuer / general partner","description":"The party that sets up the offering and sells the securities. On this site, sponsor means the operating business. Issuer means the entity that sells the securities. The investors are always the sponsor's. They never belong to a vendor.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Syndication","description":"A real estate offering of one asset or a small portfolio. The sponsor raises equity from a group of investors for one deal. Each syndication is its own offering. So the investor list must be built again each time. That is, unless the sponsor keeps the list and works it.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Evergreen fund","description":"A fund that raises and invests money all the time. It does not close on a fixed date. It is always open. This is the structure where a standing investor acquisition system is worth the most.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Investor acquisition","description":"Getting investor leads for a 506(c) or Reg A+ offering. Then you work each lead until a meeting with the sponsor is actually held. Media, response and appointment setting run as one system. It is reported as cost per appointment held.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Investor lead","description":"A person who answered the sponsor's ads and asked to hear more. They filled in a form and agreed to be contacted. Ascent never uses the word prospect for an inbound lead. Ascent never calls anyone who did not ask.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Cost per investor lead","description":"Media spend divided by the number of investor leads in the period. Published category benchmarks put it at $50 to $100 on Meta. On LinkedIn, they put it at about five times that. Agencies report this number. They do so because it is the number they control.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Speed to lead","description":"The time from a lead's form to the first outbound try by a live person. Ascent reports the median in minutes. It calls this speed to first human touch.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"First touch / first human touch","description":"Two events, each with its own time stamp. The first is the instant automatic reply (text and email). The second is the first try by a person. A CRM with only one field will report the auto-reply and call it speed.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Contact rate","description":"The share of leads who had a connected conversation. That means a live voice, not a voicemail. Ascent reports it in buckets by response time. The buckets are under five minutes, five to sixty minutes, one to twenty-four hours, and later.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Appointment set / booked","description":"A meeting placed on the sponsor's calendar. Any vendor can inflate this count. That is why Ascent never manages to this number.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Appointment held","description":"A booked meeting that took place. The investor showed up and the sponsor made the case. It is the unit of Ascent's reporting. It is also the unit of every written minimum in a proposal.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Set-to-held rate","description":"Of the meetings booked, the share that were held. This number shows the no-shows. A confirmation the day before moves it. So do reschedules and nurture between touches.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Cost per appointment held","description":"Media spend divided by appointments held in the period. It counts media only, unless a report says fully loaded. Booking meetings nobody attends cannot inflate it. That is why it is Ascent's main metric.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Fully loaded","description":"A cost-per figure that counts the vendor's fee as well as media. Compare it across vendors only when both figures are labeled the same way.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Setter / appointment setter","description":"A live person who is recruited, scripted and supervised. They call inbound investor leads as the sponsor. The call comes from a number registered to the sponsor. They check that the lead asked to hear from the sponsor. Then they get a meeting onto the calendar. They handle logistics only, never the offering. Each call is recorded.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Compliance gate","description":"The written conditions that must be met before anything goes live or anyone dials. The exemption is confirmed. An approver at counsel is named. Every legend and script is approved. On an Ascent engagement, the gate has nine conditions and one review deadline.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Legend","description":"Required disclosure text on an offering communication. Counsel sets the words for an ad, a landing page or an email. They are used word for word.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Flat monthly fee","description":"A fixed fee for a defined service. It scales with media under management. Nothing in it is tied to capital raised, investors brought in or appointments held. This fee model lets a marketing vendor stay a vendor.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"},{"@type":"DefinedTerm","name":"Media under management","description":"The monthly ad spend a firm runs for the sponsor. The sponsor pays it to the platform, on the sponsor's own account. The vendor never holds, advances or marks up this money.","inDefinedTermSet":"https://ascentforsponsors.com/guide-investor-acquisition-glossary/#terms"}]}]}</script>
